# Fly.io: change `app` to a unique name, then run: fly launch --no-deploy --copy-config && fly deploy
app = "pdfhub-change-me"
primary_region = "lhr"

[build]

[env]
  PORT = "8000"
  MAX_PARALLEL_JOBS = "1"
  MAX_UPLOAD_MB = "50"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"      # stops when idle so you pay only while it runs
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                   # LibreOffice and OCR need more than 256 MB
